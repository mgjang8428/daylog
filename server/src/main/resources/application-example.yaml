spring:
  application:
    name: daylog

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:localmemdb;MODE=MySQL;
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      default_batch_fetch_size: 1000
    show-sql: false